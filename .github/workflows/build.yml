name: Build NDK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK r21e
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - name: Extract jni
        run: unzip -o jni_new.zip
      - name: Build libblack.so
        run: ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-libs
          path: libs/
